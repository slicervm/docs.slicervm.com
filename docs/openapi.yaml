openapi: 3.0.3
info:
  title: Slicer API
  version: "0.1.71"
  description: |
    REST API for Slicer VM management. Derived from server routes and SDK types.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SlicerInfo:
      type: object
      properties:
        version:
          type: string
        git_commit:
          type: string

    SlicerHostGroup:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
        ram_bytes:
          type: integer
          format: int64
        cpus:
          type: integer
        gpu_count:
          type: integer
        arch:
          type: string

    NodeResponse:
      type: object
      properties:
        hostname:
          type: string
        hostgroup:
          type: string
        ip:
          type: string
        ram_bytes:
          type: integer
          format: int64
        cpus:
          type: integer
        created_at:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        arch:
          type: string
        status:
          type: string
          description: "Running or Paused"

    SlicerSnapshot:
      type: object
      properties:
        hostname:
          type: string
        arch:
          type: string
        timestamp:
          type: string
          format: date-time
        uptime:
          type: string
        totalCpus:
          type: integer
        totalMemory:
          type: integer
          format: uint64
        memoryUsed:
          type: integer
          format: uint64
        memoryAvailable:
          type: integer
          format: uint64
        memoryUsedPercent:
          type: number
          format: float
        loadAvg1:
          type: number
          format: float
        loadAvg5:
          type: number
          format: float
        loadAvg15:
          type: number
          format: float
        diskReadTotal:
          type: number
          format: float
        diskWriteTotal:
          type: number
          format: float
        networkReadTotal:
          type: number
          format: float
        networkWriteTotal:
          type: number
          format: float
        diskIOInflight:
          type: integer
          format: int64
        openConnections:
          type: integer
          format: int64
        openFiles:
          type: integer
          format: int64
        entropy:
          type: integer
          format: int64
        diskSpaceTotal:
          type: integer
          format: uint64
        diskSpaceUsed:
          type: integer
          format: uint64
        diskSpaceFree:
          type: integer
          format: uint64
        diskSpaceUsedPercent:
          type: number
          format: float

    NodeStatResponse:
      allOf:
        - $ref: '#/components/schemas/NodeResponse'
        - type: object
          properties:
            snapshot:
              $ref: '#/components/schemas/SlicerSnapshot'
            error:
              type: string

    Secret:
      type: object
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
        permissions:
          type: string
        uid:
          type: integer
          format: uint32
        gid:
          type: integer
          format: uint32
        mod_time:
          type: string
          format: date-time
      required: [name, size, permissions, uid, gid, mod_time]

    CreateSecretRequest:
      type: object
      properties:
        name:
          type: string
        permissions:
          type: string
        uid:
          type: integer
          format: uint32
        gid:
          type: integer
          format: uint32
        data:
          type: string
          description: Base64-encoded secret content
      required: [name, data]

    UpdateSecretRequest:
      type: object
      properties:
        permissions:
          type: string
        uid:
          type: integer
          format: uint32
        gid:
          type: integer
          format: uint32
        data:
          type: string
          description: Base64-encoded secret content

    SlicerCreateNodeRequest:
      type: object
      description: Public parameters for allocator-led VM creation.
      properties:
        ip:
          type: string
        ram_bytes:
          type: integer
          format: int64
        cpus:
          type: integer
        gpu_count:
          type: integer
        persistent:
          type: boolean
        disk_image:
          type: string
          deprecated: true
          description: Rejected via the API; the disk image is always <hostname>.img.
        import_user:
          type: string
        ssh_keys:
          type: array
          items:
            type: string
        userdata:
          type: string
        tags:
          type: array
          items:
            type: string
        secrets:
          type: array
          items:
            type: string
        pci_devices:
          type: array
          items:
            type: string
        network:
          $ref: '#/components/schemas/SlicerForkNetworkPolicy'

    SlicerCreateNodeResponse:
      type: object
      properties:
        hostname:
          type: string
        hostgroup:
          type: string
        ip:
          type: string
        created_at:
          type: string
          format: date-time
        arch:
          type: string

    SlicerResolvedNetworkPolicy:
      type: object
      required: [allow, drop]
      properties:
        allow:
          type: array
          items: { type: string }
        drop:
          type: array
          items: { type: string }

    SlicerVMNetworkDescription:
      type: object
      required: [host_group, effective]
      properties:
        mode: { type: string }
        policy_source:
          type: string
          enum: [host_group, mixed, vm]
        host_group:
          $ref: '#/components/schemas/SlicerResolvedNetworkPolicy'
        override:
          $ref: '#/components/schemas/SlicerForkNetworkPolicy'
        effective:
          $ref: '#/components/schemas/SlicerResolvedNetworkPolicy'

    SlicerVMDescription:
      allOf:
        - $ref: '#/components/schemas/NodeResponse'
        - type: object
          required: [network]
          properties:
            storage: { type: string }
            image: { type: string }
            commit_id: { type: string }
            parent_commit_id: { type: string }
            network:
              $ref: '#/components/schemas/SlicerVMNetworkDescription'

    SlicerCommitRequest:
      type: object
      properties:
        tags:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        cache_key:
          type: string
          description: Caller-owned unique key used to find or reuse a commit.

    SlicerCommitResponse:
      type: object
      properties:
        hostname: { type: string }
        commit_id: { type: string }
        status: { type: string, enum: [committed] }
        parent_status: { type: string, enum: [stopped] }
        mode: { type: string, enum: [disk] }
        tags:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        cache_key: { type: string }
      required: [hostname, commit_id, status, parent_status, mode]

    SlicerCommitInfo:
      type: object
      properties:
        commit_id: { type: string }
        source_hostname: { type: string }
        source_host_group: { type: string }
        created_at: { type: string, format: date-time }
        mode: { type: string, enum: [disk] }
        tags:
          type: array
          items: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        cache_key: { type: string }
      required: [commit_id, source_hostname, source_host_group, created_at, mode]

    SlicerForkNetworkPolicy:
      type: object
      description: Isolated-network overrides for the forked VM.
      properties:
        allow:
          type: array
          items: { type: string }
        drop:
          type: array
          items: { type: string }

    SlicerForkRequest:
      type: object
      properties:
        tags:
          type: array
          items: { type: string }
          description: Tags to append, or to replace when tag_mode is replace.
        tag_mode:
          type: string
          enum: [append, replace]
          default: append
        secrets:
          type: array
          items: { type: string }
          description: Replaces inherited secret grants. An empty array clears grants and removes inherited secret files.
        persistent:
          type: boolean
          default: true
          description: Set false to discard cloned storage when the VM stops or is deleted.
        fixups:
          type: array
          items:
            type: string
            enum: [all, none, hostname, machine-id, ssh-host-keys]
          description: Omit for all correctness fix-ups. Pass an empty array, or none by itself, to disable them; all and none must be used alone.
        vcpu:
          type: integer
          minimum: 1
          description: vCPU count, up to the source host-group limit.
        ram_bytes:
          type: integer
          format: int64
          minimum: 1
          description: RAM in bytes, up to the source host-group limit.
        network:
          $ref: '#/components/schemas/SlicerForkNetworkPolicy'

    SlicerForkResponse:
      type: object
      properties:
        hostname: { type: string, description: Allocated hostname of the forked VM. }
        source_hostname: { type: string, description: Source VM hostname. }
        commit_id: { type: string }
        status: { type: string, enum: [forked] }
        parent_status: { type: string, enum: [unchanged] }
        child_status: { type: string, enum: [starting, running] }
        mode: { type: string, enum: [disk] }
        persistent: { type: boolean }
      required: [hostname, source_hostname, commit_id, status, child_status, mode, persistent]

    SlicerCommitDeleteResponse:
      type: object
      properties:
        commit_id: { type: string }
        status: { type: string, enum: [deleted] }
      required: [commit_id, status]

    SlicerDeleteResponse:
      type: object
      properties:
        message:
          type: string
        disk_removed:
          type: string
        error:
          type: string

    SlicerLogsResponse:
      type: object
      properties:
        hostname:
          type: string
        lines:
          type: integer
        content:
          type: string

    SlicerExecRequestQuery:
      type: object
      description: Query parameters used by /vm/{hostname}/exec
      properties:
        cmd:
          type: string
        args:
          type: array
          items:
            type: string
        uid:
          type: integer
          format: uint32
        gid:
          type: integer
          format: uint32
        stdin:
          type: boolean
        stdout:
          type: boolean
        stderr:
          type: boolean
        shell:
          type: string
        cwd:
          type: string
        permissions:
          type: string
        buffered:
          type: boolean
          description: Return a single buffered response instead of streaming NDJSON.

    SlicerExecWriteResult:
      type: object
      properties:
        type:
          type: string
        pid:
          type: integer
        data:
          type: string
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        signal:
          type: string
        timestamp:
          type: string
          format: date-time
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type: integer
        error:
          type: string

    SlicerExecResult:
      type: object
      properties:
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type: integer
        error:
          type: string

    SlicerAgentHealthResponse:
      type: object
      properties:
        hostname:
          type: string
        agent_uptime:
          type: integer
          format: int64
        agent_version:
          type: string
        system_uptime:
          type: integer
          format: int64
        userdata_ran:
          type: boolean

paths:
  /info:
    get:
      summary: Get server version info
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Server version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlicerInfo'
        "401":
          description: Missing or invalid auth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /healthz:
    get:
      summary: Server liveness check
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string, example: "OK" }
    head:
      summary: Server liveness check (HEAD)
      responses:
        "200":
          description: OK

  /hostgroup:
    get:
      summary: List host groups
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Host groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlicerHostGroup'
        "401":
          description: Missing or invalid auth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /hostgroup/{name}/nodes:
    get:
      summary: List nodes in a host group
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: tag
          required: false
          schema: { type: string }
          description: Exact tag match filter. Only one of `tag` and `tag_prefix` may be set.
        - in: query
          name: tag_prefix
          required: false
          schema: { type: string }
          description: Tag prefix filter. Only one of `tag` and `tag_prefix` may be set.
      responses:
        "200":
          description: Nodes in host group
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NodeResponse' }
        "401":
          description: Missing or invalid auth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    post:
      summary: Create a node in a host group
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: query
          name: wait
          required: false
          schema:
            type: string
            enum: [agent, userdata]
          description: Wait on server side for VM readiness before returning. `agent` waits for the guest agent to report.
            `userdata` waits for both agent readiness and userdata completion.
        - in: query
          name: timeout
          required: false
          schema:
            type: string
          description: Maximum time to wait for the selected readiness signal (Go duration format, e.g. `30s`, `2m`). Defaults to `5m` when `wait` is set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlicerCreateNodeRequest' }
      responses:
        "200":
          description: Node created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlicerCreateNodeResponse' }
        "201":
          description: Node created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlicerCreateNodeResponse' }
        "400":
          description: Invalid input or limits exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "403":
          description: Trial mode or protected constraints
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Host group not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "408":
          description: Wait timed out before readiness; VM is cleaned up before the error is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /hostgroup/{name}/nodes/{node}:
    delete:
      summary: Delete a node
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
        - in: path
          name: node
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Node deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlicerDeleteResponse' }
        "403":
          description: Protected node cannot be deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /nodes:
    get:
      summary: List all nodes
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: tag
          required: false
          schema: { type: string }
          description: Exact tag match filter. Only one of `tag` and `tag_prefix` may be set.
        - in: query
          name: tag_prefix
          required: false
          schema: { type: string }
          description: Tag prefix filter. Only one of `tag` and `tag_prefix` may be set.
      responses:
        "200":
          description: Nodes list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NodeResponse' }
        "401":
          description: Missing or invalid auth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /nodes/stats:
    get:
      summary: List stats for all nodes
      security:
        - BearerAuth: []
      responses:
        "200":
          description: VM stats for all nodes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NodeStatResponse' }
        "401":
          description: Missing or invalid auth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /node/{hostname}/stats:
    get:
      summary: Get stats for a single node
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
      responses:
        "200":
          description: VM stats for node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeStatResponse' }
        "400":
          description: Invalid hostname
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /secrets:
    get:
      summary: List secrets (metadata only)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of secrets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Secret' }
        "500":
          description: Secrets directory error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    post:
      summary: Create secret
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSecretRequest' }
      responses:
        "201":
          description: Secret created
        "400":
          description: Invalid input or base64
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: Secret already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /secrets/{name}:
    patch:
      summary: Update secret metadata and/or content
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSecretRequest' }
      responses:
        "200":
          description: Secret updated
        "400":
          description: Invalid input or base64
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Secret not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      summary: Delete secret
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Secret deleted
        "404":
          description: Secret not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/logs:
    get:
      summary: Get VM logs
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
        - in: query
          name: lines
          schema:
            type: integer
          description: Number of lines to return. 0 = full file.
      responses:
        "200":
          description: Logs response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlicerLogsResponse' }
        "400":
          description: Invalid hostname or query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: VM or log file not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Read failure
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/health:
    get:
      summary: Get agent health (JSON)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Agent health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlicerAgentHealthResponse' }
        "400":
          description: No agent vsock path
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    head:
      summary: Get agent health (no body)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Agent health OK (no response body)

  /vm/{hostname}/shutdown:
    post:
      summary: Shutdown or reboot VM
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
        - in: query
          name: action
          schema:
            type: string
            enum: [shutdown, reboot]
          description: Defaults to reboot unless hypervisor is cloud-hypervisor.
      responses:
        "200":
          description: Shutdown completed for a Firecracker shutdown request; otherwise initiated
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid action or request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/pause:
    post:
      summary: Pause VM
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pause initiated
          content:
            text/plain:
              schema: { type: string }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/resume:
    post:
      summary: Resume VM
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Resume initiated
          content:
            text/plain:
              schema: { type: string }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/suspend:
    post:
      summary: Suspend a VM to disk
      description: |
        Takes a Firecracker snapshot of the VM's memory and disk state, then
        shuts down the underlying VM process. Memory is released. Pair with
        `/restore` to bring the VM back up. Supported for persistent
        Firecracker VMs in Slicer and Slicer for Mac.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Suspend initiated
          content:
            text/plain:
              schema: { type: string }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "501":
          description: Not implemented on this platform
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/restore:
    post:
      summary: Restore a VM from its snapshot
      description: |
        Restores a previously-suspended VM from its Firecracker snapshot.
        Memory and disk state come back intact. Supported for persistent
        Firecracker VMs in Slicer and Slicer for Mac.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Restore initiated
          content:
            text/plain:
              schema: { type: string }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "501":
          description: Not implemented on this platform
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/relaunch:
    post:
      summary: Relaunch an API-launched VM using its existing disk image
      description: |
        Bring a previously-created API-launched VM back up without going
        through a fresh POST /hostgroup/{name}/nodes. The disk image is
        reused so the sandbox identity is preserved. Available on both
        Slicer-for-Mac and the Linux daemon.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
      responses:
        "200":
          description: VM relaunched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlicerCreateNodeResponse' }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: VM is already running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}:
    get:
      summary: Describe a VM
      description: Returns VM lineage plus host-group, override, and effective network policy.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
      responses:
        "200":
          description: VM description
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlicerVMDescription' }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/commit:
    post:
      summary: Commit a stopped persistent VM disk
      description: >-
        Creates an immutable disk parent for Firecracker cold forks. A cold
        fork snapshots the VM's **disk only** — never CPU or RAM state — so
        the source VM must be **shut down first** (a running VM returns 409).
        Anything a fork should inherit must be written to a real on-disk path,
        not tmpfs paths like /tmp which are cleared on shutdown.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlicerCommitRequest' }
      responses:
        "200":
          description: VM committed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlicerCommitResponse' }
        "400":
          description: VM or storage is not eligible for a cold commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Persistent VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: VM is running, backing is missing, or cache key is in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/commits:
    get:
      summary: List committed VM parents
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: tag
          description: Repeat to require every supplied tag.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - in: query
          name: cache_key
          schema: { type: string }
        - in: query
          name: source
          schema: { type: string }
        - in: query
          name: mode
          schema: { type: string, enum: [disk] }
      responses:
        "200":
          description: Matching commits, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SlicerCommitInfo' }
        "500":
          description: Internal error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/commits/{commit_id}/fork:
    post:
      summary: Fork a committed VM disk
      description: >-
        Firecracker-only. Boots a new VM from a committed disk parent. The
        child inherits the parent's **disk state only** — it is a fresh boot,
        not a resumed memory/CPU snapshot. Set an environment up once, commit
        it, then fork it many times to branch from an identical starting
        point. Waits for agent readiness and guest finalisation by default;
        with wait=none, acknowledges launch while finalisation continues
        asynchronously.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: commit_id
          required: true
          schema: { type: string }
        - in: query
          name: wait
          schema: { type: string, enum: [agent, none], default: agent }
        - in: query
          name: timeout
          schema: { type: string, default: 30s }
          description: |
            Maximum time for agent readiness and guest finalisation. When
            waiting, expiry returns 408 and rolls back the forked VM. If the VM
            process cannot be confirmed stopped, its failed state is left
            intact for inspection.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlicerForkRequest' }
      responses:
        "200":
          description: VM forked; child_status is running when waited or starting for launch acknowledgement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlicerForkResponse' }
        "400":
          description: Invalid network policy, wait mode, or unsupported host group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Commit not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: Allocated VM state already exists or commit backing is missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "408":
          description: Agent readiness or finalisation timed out; VM rollback was attempted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "502":
          description: Guest agent readiness or identity finalisation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal or launch error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/commits/{commit_id}:
    delete:
      summary: Delete an unused committed VM parent
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: commit_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Commit deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlicerCommitDeleteResponse' }
        "404":
          description: Commit not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: Persistent source or forked VMs still use the commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "500":
          description: Internal or storage cleanup error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/exec:
    post:
      summary: Execute a command in the VM (streaming NDJSON)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
        - in: query
          name: cmd
          required: true
          schema: { type: string }
        - in: query
          name: args
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - in: query
          name: uid
          schema: { type: integer, format: uint32 }
        - in: query
          name: gid
          schema: { type: integer, format: uint32 }
        - in: query
          name: stdin
          schema: { type: boolean }
        - in: query
          name: stdout
          schema: { type: boolean }
        - in: query
          name: stderr
          schema: { type: boolean }
        - in: query
          name: shell
          schema: { type: string }
        - in: query
          name: cwd
          schema: { type: string }
        - in: query
          name: permissions
          schema: { type: string }
        - in: query
          name: buffered
          schema: { type: boolean }
      requestBody:
        description: Optional raw stdin stream when stdin=true.
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stream of JSON lines with exec output (default). When `buffered=true`, returns one JSON object.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlicerExecResult' }
            application/x-ndjson:
              schema: { $ref: '#/components/schemas/SlicerExecWriteResult' }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: VM paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/cp:
    get:
      summary: Copy files from VM to host (binary/tar stream)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: true
          schema: { type: string }
        - in: query
          name: mode
          schema: { type: string, enum: [tar, binary] }
        - in: query
          name: permissions
          schema: { type: string }
      responses:
        "200":
          description: File stream
          headers:
            X-Slicer-File-Mode:
              description: Octal file mode of the returned file (for binary mode)
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: VM paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    post:
      summary: Copy files from host to VM (binary/tar stream)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: true
          schema: { type: string }
        - in: query
          name: uid
          schema: { type: integer, format: uint32 }
        - in: query
          name: gid
          schema: { type: integer, format: uint32 }
        - in: query
          name: mode
          schema: { type: string, enum: [tar, binary] }
        - in: query
          name: permissions
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: File received
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: VM paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/fs/readdir:
    get:
      summary: List directory entries
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Directory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                      enum: [file, directory, symlink]
                    size:
                      type: integer
                      format: int64
                    mtime:
                      type: integer
                      format: int64
                    mode:
                      type: string
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Path not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: VM paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/fs/stat:
    get:
      summary: Stat a path
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Path metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    type: string
                    enum: [file, directory, symlink]
                  size:
                    type: integer
                    format: int64
                  mtime:
                    type: integer
                    format: int64
                  mode:
                    type: string
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Path not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: VM paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/fs/mkdir:
    post:
      summary: Create a directory
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                recursive:
                  type: boolean
                mode:
                  type: string
      responses:
        "200":
          description: Directory created
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: VM paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/fs/remove:
    delete:
      summary: Remove a file or directory
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
        - in: query
          name: path
          required: true
          schema: { type: string }
        - in: query
          name: recursive
          schema: { type: boolean }
      responses:
        "200":
          description: Path removed
        "400":
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: Path not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: VM paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vm/{hostname}/shell:
    get:
      summary: Interactive shell (WebSocket upgrade)
      description: WebSocket endpoint for VM shell. Optional query params for uid/gid/shell/cwd.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
        - in: query
          name: uid
          schema: { type: integer, format: uint32 }
        - in: query
          name: gid
          schema: { type: integer, format: uint32 }
        - in: query
          name: shell
          schema: { type: string }
        - in: query
          name: cwd
          schema: { type: string }
      responses:
        "101":
          description: Switching Protocols (WebSocket)
        "400":
          description: Invalid request or agent capability mismatch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "409":
          description: VM paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
      x-websocket: true

  /vm/{hostname}/forward:
    get:
      summary: Forward TCP via VM agent (inlets)
      description: |
        Tunnel forward endpoint. The router does not restrict HTTP method; typically used
        with CONNECT/upgrade semantics by the inlets client.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: hostname
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tunnel established or proxying
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        "404":
          description: VM not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus metrics text
          content:
            text/plain:
              schema: { type: string }
